<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10141a"><title>Price History</title><style>:root{--bg:#10141a;--panel:#18202a;--panel2:#121922;--line:#2b3746;--ink:#edf3f8;--muted:#93a4b5;--good:#53d486;--purple:#a970ff;--warn:#e2af52}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom));line-height:1.4;max-width:980px;margin:auto}.top{display:flex;gap:10px;align-items:flex-start;padding:15px 0 12px}.back{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:8px 10px;text-decoration:none;font-size:12px}.title{font-size:20px;font-weight:750;line-height:1.15}.meta,.small{color:var(--muted);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}.name{font-weight:650}.section{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 3px 8px}.chart{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;overflow:hidden}.chart canvas{width:100%;height:280px;display:block}.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.legend span{font-size:11px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.price{font-weight:750;font-variant-numeric:tabular-nums;text-align:right}.status{font-size:11px;color:var(--muted)}.baseline{border-left:3px solid var(--warn);padding-left:10px}a{color:inherit}</style></head><body><div class="top"><a class="back" href="index.html">‹ Back</a><div><div id="title" class="title">Price history</div><div id="model" class="meta"></div></div></div><div class="card"><div class="name">Price history graph</div><div class="meta">Verified strong-match prices are plotted by retailer. A single observation is shown as a dot. Historical reference pricing is shown as a dashed line when available.</div><div class="chart"><canvas id="chart"></canvas></div><div id="legend" class="legend"></div></div><div class="section">Previous prices</div><div id="list" class="card"><div class="small">Loading…</div></div><script>'use strict';const $=s=>document.querySelector(s),money=n=>typeof n==='number'?'$'+n.toLocaleString('en-US',{maximumFractionDigits:2}):'$—',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function trusted(o){return !!(o&&o.status==='verified'&&typeof o.price==='number'&&(o.method!=='serpapi_google_shopping'||o.match_status==='strong'))}function parseDate(v){const d=new Date(v);return Number.isFinite(d.getTime())?d:null}async function getJSON(p){const r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}function baselineFor(id,h){const b=h?.baselines||{};if(b[id]&&typeof b[id].price==='number')return b[id];const mapped=Object.values(b).filter(x=>x?.maps_to===id&&typeof x.price==='number');return mapped.sort((a,b)=>a.price-b.price)[0]||null}function draw(rows,baseline){const canvas=$('#chart'),wrap=canvas.parentElement,dpr=Math.max(1,Math.min(2,devicePixelRatio||1)),w=Math.max(280,wrap.clientWidth-16),h=280;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);const c=canvas.getContext('2d');c.scale(dpr,dpr);const styles=getComputedStyle(document.documentElement),grid=styles.getPropertyValue('--line').trim(),muted=styles.getPropertyValue('--muted').trim(),warn=styles.getPropertyValue('--warn').trim();const pts=rows.map(o=>({o,t:parseDate(o.timestamp)?.getTime(),p:o.price})).filter(x=>Number.isFinite(x.t)&&Number.isFinite(x.p));const bd=baseline&&parseDate(baseline.date),bp=baseline&&typeof baseline.price==='number'?baseline.price:null;if(!pts.length&&bp==null){c.fillStyle=muted;c.font='12px system-ui';c.fillText('No verified or historical price points available yet.',14,30);$('#legend').innerHTML='';return}let times=pts.map(x=>x.t);if(bd)times.push(bd.getTime());if(!times.length){const now=Date.now();times=[now-43200000,now+43200000]}let minT=Math.min(...times),maxT=Math.max(...times);if(minT===maxT){minT-=43200000;maxT+=43200000}let prices=pts.map(x=>x.p);if(bp!=null)prices.push(bp);let minP=Math.min(...prices),maxP=Math.max(...prices);if(minP===maxP){minP-=Math.max(1,minP*.03);maxP+=Math.max(1,maxP*.03)}else{const margin=(maxP-minP)*.08;minP-=margin;maxP+=margin}const pad={l:60,r:14,t:16,b:34},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,x=t=>pad.l+(t-minT)/(maxT-minT)*iw,y=p=>pad.t+(maxP-p)/(maxP-minP)*ih;c.strokeStyle=grid;c.fillStyle=muted;c.lineWidth=1;c.font='10px system-ui';for(let i=0;i<=4;i++){const yy=pad.t+ih*i/4,price=maxP-(maxP-minP)*i/4;c.beginPath();c.moveTo(pad.l,yy);c.lineTo(w-pad.r,yy);c.stroke();c.fillText(money(price),4,yy+3)}const rs=[...new Set(pts.map(x=>x.o.retailer||'Unknown'))],palette=['#a970ff','#53d486','#e2af52','#6bb8ff','#ed6b62','#d58cff','#77d8c8','#f09a63'];let legend=rs.map((r,i)=>`<span><i class="dot" style="background:${palette[i%palette.length]}"></i> ${esc(r)}</span>`);rs.forEach((r,i)=>{const a=pts.filter(x=>(x.o.retailer||'Unknown')===r).sort((u,v)=>u.t-v.t),col=palette[i%palette.length];c.strokeStyle=col;c.fillStyle=col;c.lineWidth=2;if(a.length>1){c.beginPath();a.forEach((pt,j)=>j?c.lineTo(x(pt.t),y(pt.p)):c.moveTo(x(pt.t),y(pt.p)));c.stroke()}a.forEach(pt=>{c.beginPath();c.arc(x(pt.t),y(pt.p),a.length===1?5:3.5,0,Math.PI*2);c.fill()})});if(bp!=null){const yy=y(bp);c.save();c.strokeStyle=warn;c.lineWidth=2;c.setLineDash([6,5]);c.beginPath();c.moveTo(pad.l,yy);c.lineTo(w-pad.r,yy);c.stroke();c.restore();legend.push(`<span><i class="dot" style="background:${warn}"></i> Historical reference ${money(bp)}</span>`)}$('#legend').innerHTML=legend.join('');c.fillStyle=muted;c.font='10px system-ui';const s=new Date(minT).toLocaleDateString(),e=new Date(maxT).toLocaleDateString();c.fillText(s,pad.l,h-8);c.fillText(e,Math.max(pad.l,w-pad.r-c.measureText(e).width),h-8)}let rows=[],baseline=null;async function boot(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('No item selected');const [products,historical]=await Promise.all([getJSON('data/products.json'),getJSON('data/historical_baselines.json').catch(()=>null)]),p=products.find(x=>x.id===id);if(!p)throw new Error('Item not found');$('#title').textContent=p.label||'Price history';$('#model').textContent=p.model||'';baseline=baselineFor(id,historical);const obs=await getJSON('data/observations/'+encodeURIComponent(id)+'.json').catch(()=>[]);rows=(obs||[]).filter(trusted).sort((a,b)=>String(a.timestamp||'').localeCompare(String(b.timestamp||'')));const newest=rows.slice().reverse(),items=[];if(baseline){const bd=parseDate(baseline.date),when=bd?bd.toLocaleDateString():esc(baseline.date||'Historical'),link=baseline.source_url?` · <a href="${esc(baseline.source_url)}" target="_blank" rel="noopener">source</a>`:'';items.push(`<div class="row baseline"><div><div class="name">Historical reference · ${esc(baseline.retailer||'reference')}</div><div class="meta">${when} · ${esc(baseline.model||p.model||'')}${baseline.note?' · '+esc(baseline.note):''}</div><div class="status">historical context${link}</div></div><div class="price">${money(baseline.price)}</div></div>`)}newest.forEach(o=>{const d=parseDate(o.timestamp),when=d?d.toLocaleString():esc(o.timestamp||'Unknown date'),link=o.source_url?` · <a href="${esc(o.source_url)}" target="_blank" rel="noopener">open listing</a>`:'';items.push(`<div class="row"><div><div class="name">${esc(o.retailer||'Unknown retailer')}</div><div class="meta">${when}${o.title?' · '+esc(o.title):''}</div><div class="status">verified · strong match${link}</div></div><div class="price">${money(o.price)}</div></div>`)});$('#list').innerHTML=items.length?items.join(''):'<div class="small">No verified price history has been recorded for this item yet.</div>';draw(rows,baseline)}catch(e){$('#list').innerHTML='<div class="small">Could not load price history: '+esc(e.message)+'</div>'}}addEventListener('resize',()=>draw(rows,baseline));boot();</script></body></html>
