<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10141a"><title>Price History</title><style>:root{--bg:#10141a;--panel:#18202a;--panel2:#121922;--line:#2b3746;--ink:#edf3f8;--muted:#93a4b5;--good:#53d486;--purple:#a970ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom));line-height:1.4;max-width:980px;margin:auto}.top{display:flex;gap:10px;align-items:flex-start;padding:15px 0 12px}.back{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:8px 10px;text-decoration:none;font-size:12px}.title{font-size:20px;font-weight:750;line-height:1.15}.meta,.small{color:var(--muted);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}.name{font-weight:650}.section{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 3px 8px}.chart{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;overflow:hidden}.chart canvas{width:100%;height:260px;display:block}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.legend span{font-size:11px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.price{font-weight:750;font-variant-numeric:tabular-nums;text-align:right}.status{font-size:11px;color:var(--muted)}a{color:inherit}</style></head><body><div class="top"><a class="back" href="index.html">‹ Back</a><div><div id="title" class="title">Price history</div><div id="model" class="meta"></div></div></div><div class="card"><div class="name">Verified price graph</div><div class="meta">Each line is a retailer. Only trusted verified observations are plotted.</div><div class="chart"><canvas id="chart"></canvas></div><div id="legend" class="legend"></div></div><div class="section">Previous prices</div><div id="list" class="card"><div class="small">Loading…</div></div><script>'use strict';const $=s=>document.querySelector(s),money=n=>typeof n==='number'?'$'+n.toLocaleString('en-US',{maximumFractionDigits:2}):'$—',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function trusted(o){return !!(o&&o.status==='verified'&&typeof o.price==='number'&&(o.method!=='serpapi_google_shopping'||o.match_status==='strong'))}function parseDate(v){const d=new Date(v);return Number.isFinite(d.getTime())?d:null}async function getJSON(p){const r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}function draw(rows){const canvas=$('#chart'),wrap=canvas.parentElement,dpr=Math.max(1,Math.min(2,devicePixelRatio||1)),w=Math.max(280,wrap.clientWidth-16),h=260;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);const c=canvas.getContext('2d');c.scale(dpr,dpr);const styles=getComputedStyle(document.documentElement),line=styles.getPropertyValue('--line').trim(),muted=styles.getPropertyValue('--muted').trim(),ink=styles.getPropertyValue('--ink').trim();const pts=rows.map(o=>({o,t:parseDate(o.timestamp)?.getTime(),p:o.price})).filter(x=>Number.isFinite(x.t)&&Number.isFinite(x.p));if(!pts.length){c.fillStyle=muted;c.font='12px system-ui';c.fillText('No verified prices to graph yet.',14,30);$('#legend').innerHTML='';return}let minT=Math.min(...pts.map(x=>x.t)),maxT=Math.max(...pts.map(x=>x.t)),minP=Math.min(...pts.map(x=>x.p)),maxP=Math.max(...pts.map(x=>x.p));if(minT===maxT){minT-=43200000;maxT+=43200000}if(minP===maxP){minP-=Math.max(1,minP*.03);maxP+=Math.max(1,maxP*.03)}const pad={l:54,r:12,t:14,b:30},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,x=t=>pad.l+(t-minT)/(maxT-minT)*iw,y=p=>pad.t+(maxP-p)/(maxP-minP)*ih;c.strokeStyle=line;c.fillStyle=muted;c.lineWidth=1;c.font='10px system-ui';for(let i=0;i<=4;i++){const yy=pad.t+ih*i/4,price=maxP-(maxP-minP)*i/4;c.beginPath();c.moveTo(pad.l,yy);c.lineTo(w-pad.r,yy);c.stroke();c.fillText(money(price),4,yy+3)}const rs=[...new Set(pts.map(x=>x.o.retailer||'Unknown'))],palette=['#a970ff','#53d486','#e2af52','#6bb8ff','#ed6b62','#d58cff','#77d8c8','#f09a63'];$('#legend').innerHTML=rs.map((r,i)=>`<span><i class="dot" style="background:${palette[i%palette.length]}"></i> ${esc(r)}</span>`).join('');rs.forEach((r,i)=>{const a=pts.filter(x=>(x.o.retailer||'Unknown')===r).sort((u,v)=>u.t-v.t);c.strokeStyle=palette[i%palette.length];c.fillStyle=palette[i%palette.length];c.lineWidth=2;c.beginPath();a.forEach((pt,j)=>j?c.lineTo(x(pt.t),y(pt.p)):c.moveTo(x(pt.t),y(pt.p)));c.stroke();a.forEach(pt=>{c.beginPath();c.arc(x(pt.t),y(pt.p),3,0,Math.PI*2);c.fill()})});c.fillStyle=ink;c.font='10px system-ui';const s=new Date(minT).toLocaleDateString(),e=new Date(maxT).toLocaleDateString();c.fillText(s,pad.l,h-8);c.fillText(e,Math.max(pad.l,w-pad.r-c.measureText(e).width),h-8)}let rows=[];async function boot(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('No item selected');const products=await getJSON('data/products.json'),p=products.find(x=>x.id===id);if(!p)throw new Error('Item not found');$('#title').textContent=p.label||'Price history';$('#model').textContent=p.model||'';const obs=await getJSON('data/observations/'+encodeURIComponent(id)+'.json').catch(()=>[]);rows=(obs||[]).filter(trusted).sort((a,b)=>String(a.timestamp||'').localeCompare(String(b.timestamp||'')));const newest=rows.slice().reverse();$('#list').innerHTML=newest.length?newest.map(o=>{const d=parseDate(o.timestamp),when=d?d.toLocaleString():esc(o.timestamp||'Unknown date'),link=o.source_url?` · <a href="${esc(o.source_url)}" target="_blank" rel="noopener">open listing</a>`:'';return `<div class="row"><div><div class="name">${esc(o.retailer||'Unknown retailer')}</div><div class="meta">${when}${o.title?' · '+esc(o.title):''}</div><div class="status">verified · strong match${link}</div></div><div class="price">${money(o.price)}</div></div>`}).join(''):'<div class="small">No verified price history has been recorded for this item yet.</div>';draw(rows)}catch(e){$('#list').innerHTML='<div class="small">Could not load price history: '+esc(e.message)+'</div>'}}addEventListener('resize',()=>rows.length&&draw(rows));boot();</script></body></html>
