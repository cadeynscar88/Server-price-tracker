<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10141a"><title>Price History</title><style>:root{--bg:#10141a;--panel:#18202a;--panel2:#121922;--line:#2b3746;--ink:#edf3f8;--muted:#93a4b5;--good:#53d486;--purple:#a970ff;--warn:#e2af52;--blue:#6bb8ff;--bad:#ed6b62}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom));line-height:1.4;max-width:980px;margin:auto}.top{display:flex;gap:10px;align-items:flex-start;padding:15px 0 12px}.back{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:8px 10px;text-decoration:none;font-size:12px}.title{font-size:20px;font-weight:750;line-height:1.15}.meta,.small{color:var(--muted);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}.name{font-weight:650}.section{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 3px 8px}.chart{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;min-height:290px}.chart svg{width:100%;height:280px;display:block;overflow:visible}.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.legend span{font-size:11px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.price{font-weight:750;font-variant-numeric:tabular-nums;text-align:right}.status{font-size:11px;color:var(--muted)}.baseline{border-left:3px solid var(--warn);padding-left:10px}a{color:inherit}</style></head><body><div class="top"><a class="back" href="index.html">‹ Back</a><div><div id="title" class="title">Price history</div><div id="model" class="meta"></div></div></div><div class="card"><div class="name">Price history graph</div><div id="graph-note" class="meta">Loading graph…</div><div class="chart"><svg id="chart" viewBox="0 0 720 280" preserveAspectRatio="none" aria-label="Price history graph"></svg></div><div id="legend" class="legend"></div></div><div class="section">Previous prices</div><div id="list" class="card"><div class="small">Loading…</div></div><script>'use strict';const $=s=>document.querySelector(s),money=n=>typeof n==='number'?'$'+n.toLocaleString('en-US',{maximumFractionDigits:2}):'$—',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function trusted(o){return !!(o&&o.status==='verified'&&typeof o.price==='number'&&(o.method!=='serpapi_google_shopping'||o.match_status==='strong'))}function parseDate(v){const d=new Date(v);return Number.isFinite(d.getTime())?d:null}async function getJSON(p){const r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}function baselineFor(id,h){const b=h?.baselines||{};if(b[id]&&typeof b[id].price==='number')return b[id];const mapped=Object.values(b).filter(x=>x?.maps_to===id&&typeof x.price==='number');return mapped.sort((a,b)=>a.price-b.price)[0]||null}function svgEl(tag,a={}){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}function draw(rows,baseline){const svg=$('#chart');svg.replaceChildren();const W=720,H=280,pad={l:72,r:16,t:18,b:38},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;const styles=getComputedStyle(document.documentElement),grid=styles.getPropertyValue('--line').trim(),muted=styles.getPropertyValue('--muted').trim(),warn=styles.getPropertyValue('--warn').trim();const pts=rows.map(o=>({o,t:parseDate(o.timestamp)?.getTime(),p:o.price})).filter(x=>Number.isFinite(x.t)&&Number.isFinite(x.p));const bd=baseline&&parseDate(baseline.date),bp=baseline&&typeof baseline.price==='number'?baseline.price:null;let times=pts.map(x=>x.t);if(bd)times.push(bd.getTime());if(!times.length){const now=Date.now();times=[now-86400000,now]}let minT=Math.min(...times),maxT=Math.max(...times);if(minT===maxT){minT-=43200000;maxT+=43200000}let prices=pts.map(x=>x.p);if(bp!=null)prices.push(bp);if(!prices.length)prices=[0,1];let minP=Math.min(...prices),maxP=Math.max(...prices);if(minP===maxP){const m=Math.max(1,Math.abs(minP)*.05);minP-=m;maxP+=m}else{const m=(maxP-minP)*.08;minP-=m;maxP+=m}const x=t=>pad.l+(t-minT)/(maxT-minT)*iw,y=p=>pad.t+(maxP-p)/(maxP-minP)*ih;for(let i=0;i<=4;i++){const yy=pad.t+ih*i/4,price=maxP-(maxP-minP)*i/4;svg.append(svgEl('line',{x1:pad.l,y1:yy,x2:W-pad.r,y2:yy,stroke:grid,'stroke-width':'1'}));const tx=svgEl('text',{x:4,y:yy+4,fill:muted,'font-size':'11'});tx.textContent=money(price);svg.append(tx)}const palette=['#a970ff','#53d486','#e2af52','#6bb8ff','#ed6b62','#d58cff','#77d8c8','#f09a63'];const rs=[...new Set(pts.map(x=>x.o.retailer||'Unknown'))],legend=[];rs.forEach((r,i)=>{const a=pts.filter(x=>(x.o.retailer||'Unknown')===r).sort((u,v)=>u.t-v.t),col=palette[i%palette.length];if(a.length>1){svg.append(svgEl('polyline',{points:a.map(pt=>`${x(pt.t)},${y(pt.p)}`).join(' '),fill:'none',stroke:col,'stroke-width':'3','stroke-linejoin':'round','stroke-linecap':'round'}))}a.forEach(pt=>svg.append(svgEl('circle',{cx:x(pt.t),cy:y(pt.p),r:a.length===1?'7':'5',fill:col,stroke:'#10141a','stroke-width':'2'})));legend.push(`<span><i class="dot" style="background:${col}"></i> ${esc(r)}</span>`)});if(bp!=null){const yy=y(bp);svg.append(svgEl('line',{x1:pad.l,y1:yy,x2:W-pad.r,y2:yy,stroke:warn,'stroke-width':'3','stroke-dasharray':'8 7'}));legend.push(`<span><i class="dot" style="background:${warn}"></i> Historical reference ${money(bp)}</span>`)}const st=svgEl('text',{x:pad.l,y:H-10,fill:muted,'font-size':'11'});st.textContent=new Date(minT).toLocaleDateString();svg.append(st);const et=svgEl('text',{x:W-pad.r,y:H-10,fill:muted,'font-size':'11','text-anchor':'end'});et.textContent=new Date(maxT).toLocaleDateString();svg.append(et);if(!pts.length&&bp==null){const msg=svgEl('text',{x:W/2,y:H/2,fill:muted,'font-size':'15','text-anchor':'middle'});msg.textContent='No verified price points yet';svg.append(msg);$('#graph-note').textContent='The graph is ready; no verified price has been recorded for this item yet.'}else if(pts.length===0&&bp!=null){$('#graph-note').textContent='Historical reference shown. Current verified retailer prices will appear here as dots after successful checks.'}else if(pts.length===1){$('#graph-note').textContent='One verified price is available, so it is shown as a dot. More checks will build the line.'}else{$('#graph-note').textContent='Verified prices are plotted by retailer. Rejected or wrong-product results are excluded.'}$('#legend').innerHTML=legend.join('')}let rows=[],baseline=null;async function boot(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('No item selected');const [products,historical]=await Promise.all([getJSON('data/products.json'),getJSON('data/historical_baselines.json').catch(()=>null)]),p=products.find(x=>x.id===id);if(!p)throw new Error('Item not found');$('#title').textContent=p.label||'Price history';$('#model').textContent=p.model||'';baseline=baselineFor(id,historical);const obs=await getJSON('data/observations/'+encodeURIComponent(id)+'.json').catch(()=>[]);rows=(obs||[]).filter(trusted).sort((a,b)=>String(a.timestamp||'').localeCompare(String(b.timestamp||'')));const newest=rows.slice().reverse(),items=[];if(baseline){const bd=parseDate(baseline.date),when=bd?bd.toLocaleDateString():esc(baseline.date||'Historical'),link=baseline.source_url?` · <a href="${esc(baseline.source_url)}" target="_blank" rel="noopener">source</a>`:'';items.push(`<div class="row baseline"><div><div class="name">Historical reference · ${esc(baseline.retailer||'reference')}</div><div class="meta">${when} · ${esc(baseline.model||p.model||'')}${baseline.note?' · '+esc(baseline.note):''}</div><div class="status">historical context${link}</div></div><div class="price">${money(baseline.price)}</div></div>`)}newest.forEach(o=>{const d=parseDate(o.timestamp),when=d?d.toLocaleString():esc(o.timestamp||'Unknown date'),link=o.source_url?` · <a href="${esc(o.source_url)}" target="_blank" rel="noopener">open listing</a>`:'';items.push(`<div class="row"><div><div class="name">${esc(o.retailer||'Unknown retailer')}</div><div class="meta">${when}${o.title?' · '+esc(o.title):''}</div><div class="status">verified · strong match${link}</div></div><div class="price">${money(o.price)}</div></div>`)});$('#list').innerHTML=items.length?items.join(''):'<div class="small">No verified price history has been recorded for this item yet.</div>';draw(rows,baseline)}catch(e){$('#graph-note').textContent='Could not load graph: '+e.message;$('#list').innerHTML='<div class="small">Could not load price history: '+esc(e.message)+'</div>'}}boot();</script></body></html>
