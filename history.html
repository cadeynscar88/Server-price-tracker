<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141a">
<title>Price History</title>
<style>
:root{--bg:#10141a;--panel:#18202a;--panel2:#121922;--line:#2b3746;--ink:#edf3f8;--muted:#93a4b5;--good:#53d486;--purple:#a970ff;--warn:#e2af52;--blue:#6bb8ff;--bad:#ed6b62}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom));line-height:1.4;max-width:980px;margin:auto}.top{display:flex;gap:10px;align-items:flex-start;padding:15px 0 12px}.back{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:8px 10px;text-decoration:none;font-size:12px}.title{font-size:20px;font-weight:750;line-height:1.15}.meta,.small{color:var(--muted);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}.name{font-weight:650}.section{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 3px 8px}.chart{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;min-height:290px}.chart svg{width:100%;height:280px;display:block;overflow:visible}.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.legend span{font-size:11px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.price{font-weight:750;font-variant-numeric:tabular-nums;text-align:right}.status{font-size:11px;color:var(--muted)}a{color:inherit}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 6px;margin-right:5px;font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<div class="top"><a class="back" href="index.html">‹ Back</a><div><div id="title" class="title">Price history</div><div id="model" class="meta"></div></div></div>
<div class="card"><div class="name">Price history graph</div><div id="graph-note" class="meta">Loading graph…</div><div class="chart"><svg id="chart" viewBox="0 0 720 280" preserveAspectRatio="none" aria-label="Price history graph"></svg></div><div id="legend" class="legend"></div></div>
<div class="section">Collected prices</div><div id="list" class="card"><div class="small">Loading…</div></div>
<script>
'use strict';
const $=s=>document.querySelector(s), money=n=>typeof n==='number'?'$'+n.toLocaleString('en-US',{maximumFractionDigits:2}):'$—', esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseDate(v){const d=new Date(v);return Number.isFinite(d.getTime())?d:null}
async function getJSON(p){const r=await fetch(p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function trusted(o){return !!(o&&o.status==='verified'&&typeof o.price==='number'&&(o.method!=='serpapi_google_shopping'||o.match_status==='strong'))}
function svgEl(tag,a={}){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}
function purchaseFor(id,cfg){const map={'cpu-9950x3d':'cpu','motherboard-taichi-white':'motherboard','gpu-frieren-5070ti':'gaming_gpu','case-o11-evo-rgb-white':'case','ram-royal-neo-96':'ram','psu-asrock-pg1600g':'psu','nvme-nm790-4tb':'main_storage_1'};const x=cfg?.purchased_components?.[map[id]];if(!x)return null;const price=typeof x.purchase_price_usd==='number'?x.purchase_price_usd:(typeof x.reported_after_tax_usd_approx==='number'?x.reported_after_tax_usd_approx:null);if(price==null)return null;return {component_id:id,retailer:x.retailer||'Recorded purchase',price,status:'verified',method:'purchase_record',match_status:'strong',timestamp:x.purchase_date||null,notes:x.purchase_date?'Recorded purchase price.':'Recorded purchase price; purchase date not recorded.'}}
function historicalFor(id,h){const out=[];for(const [key,b] of Object.entries(h?.baselines||{})){if((key===id||b?.maps_to===id)&&typeof b?.price==='number')out.push({component_id:id,retailer:b.retailer||'Historical reference',price:b.price,status:'verified',method:'historical_reference',match_status:'strong',timestamp:b.date||null,source_url:b.source_url||null,notes:b.note||'',model:b.model||'',confidence:b.confidence||''})}return out}
function sourceLabel(o){if(o.method==='purchase_record')return'purchase';if(o.method==='manual_verified')return'manual';if(o.method==='historical_reference')return'historical';return'automated'}
function draw(rows){const svg=$('#chart');svg.replaceChildren();const W=720,H=280,pad={l:72,r:16,t:18,b:38},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;const styles=getComputedStyle(document.documentElement),grid=styles.getPropertyValue('--line').trim(),muted=styles.getPropertyValue('--muted').trim();const pts=rows.map(o=>({o,t:parseDate(o.timestamp)?.getTime(),p:o.price})).filter(x=>Number.isFinite(x.t)&&Number.isFinite(x.p));let times=pts.map(x=>x.t);if(!times.length){const now=Date.now();times=[now-86400000,now]}let minT=Math.min(...times),maxT=Math.max(...times);if(minT===maxT){minT-=43200000;maxT+=43200000}let prices=pts.map(x=>x.p);if(!prices.length)prices=[0,1];let minP=Math.min(...prices),maxP=Math.max(...prices);if(minP===maxP){const m=Math.max(1,Math.abs(minP)*.05);minP-=m;maxP+=m}else{const m=(maxP-minP)*.08;minP-=m;maxP+=m}const x=t=>pad.l+(t-minT)/(maxT-minT)*iw,y=p=>pad.t+(maxP-p)/(maxP-minP)*ih;for(let i=0;i<=4;i++){const yy=pad.t+ih*i/4,price=maxP-(maxP-minP)*i/4;svg.append(svgEl('line',{x1:pad.l,y1:yy,x2:W-pad.r,y2:yy,stroke:grid,'stroke-width':'1'}));const tx=svgEl('text',{x:4,y:yy+4,fill:muted,'font-size':'11'});tx.textContent=money(price);svg.append(tx)}const palette={automated:'#a970ff',manual:'#53d486',purchase:'#e2af52',historical:'#6bb8ff'};const legend=[];for(const kind of ['automated','manual','purchase','historical']){const a=pts.filter(x=>sourceLabel(x.o)===kind).sort((u,v)=>u.t-v.t),col=palette[kind];if(!a.length)continue;if(a.length>1)svg.append(svgEl('polyline',{points:a.map(pt=>`${x(pt.t)},${y(pt.p)}`).join(' '),fill:'none',stroke:col,'stroke-width':'2.5','stroke-linejoin':'round','stroke-linecap':'round',opacity:'.75'}));a.forEach(pt=>svg.append(svgEl('circle',{cx:x(pt.t),cy:y(pt.p),r:'5',fill:col,stroke:'#10141a','stroke-width':'2'})));legend.push(`<span><i class="dot" style="background:${col}"></i> ${kind}</span>`)}const st=svgEl('text',{x:pad.l,y:H-10,fill:muted,'font-size':'11'});st.textContent=new Date(minT).toLocaleDateString();svg.append(st);const et=svgEl('text',{x:W-pad.r,y:H-10,fill:muted,'font-size':'11','text-anchor':'end'});et.textContent=new Date(maxT).toLocaleDateString();svg.append(et);if(!pts.length){const msg=svgEl('text',{x:W/2,y:H/2,fill:muted,'font-size':'15','text-anchor':'middle'});msg.textContent='No dated verified price points yet';svg.append(msg)}$('#legend').innerHTML=legend.join('');$('#graph-note').textContent=pts.length?`Showing ${pts.length} dated verified price point${pts.length===1?'':'s'} from automated checks, manual verification, purchases and historical research.`:'No dated verified price points are available yet.'}
async function boot(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('No item selected');const [products,historical,manual,cfg]=await Promise.all([getJSON('data/products.json'),getJSON('data/historical_baselines.json').catch(()=>({baselines:{}})),getJSON('data/manual_observations.json').catch(()=>[]),getJSON('data/config.json').catch(()=>({}))]);const p=products.find(x=>x.id===id);if(!p)throw new Error('Item not found');$('#title').textContent=p.label||'Price history';$('#model').textContent=p.model||'';const auto=await getJSON('data/observations/'+encodeURIComponent(id)+'.json').catch(()=>[]);let rows=[...(auto||[]).filter(trusted),...(manual||[]).filter(o=>o.component_id===id&&trusted(o)),...historicalFor(id,historical)];const purchase=purchaseFor(id,cfg);if(purchase)rows.push(purchase);const seen=new Set();rows=rows.filter(o=>{const k=[o.method,o.retailer,o.price,o.timestamp,o.source_url||'',o.notes||''].join('|');if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>String(a.timestamp||'').localeCompare(String(b.timestamp||'')));draw(rows);const newest=rows.slice().sort((a,b)=>{const at=parseDate(a.timestamp)?.getTime()||0,bt=parseDate(b.timestamp)?.getTime()||0;return bt-at});const items=newest.map(o=>{const d=parseDate(o.timestamp),when=d?d.toLocaleString(): 'date not recorded',link=o.source_url?` · <a href="${esc(o.source_url)}" target="_blank" rel="noopener">source</a>`:'',kind=sourceLabel(o);return `<div class="row"><div><div class="name">${esc(o.retailer||'Unknown retailer')}</div><div class="meta">${when}${o.model?' · '+esc(o.model):''}</div><div class="status"><span class="tag">${kind}</span>${esc(o.notes||'verified price')}${link}</div></div><div class="price">${money(o.price)}</div></div>`});$('#list').innerHTML=items.length?items.join(''):'<div class="small">No verified price history has been recorded for this item yet.</div>'}catch(e){$('#graph-note').textContent='Could not load graph: '+e.message;$('#list').innerHTML='<div class="small">Could not load price history: '+esc(e.message)+'</div>'}}
boot();
</script>
</body></html>
