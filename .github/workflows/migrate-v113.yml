name: Migrate tracker to v1.1.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize layout and update v1.1.3 catalog
        shell: bash
        run: |
          set -euo pipefail
          # Normalize folder names to the lowercase paths used by GitHub Pages and the app.
          [ -d Data ] && git mv Data data || true
          [ -d Scripts ] && git mv Scripts scripts || true
          [ -d Icons ] && git mv Icons icons || true
          rm -rf scripts/__pycache__ || true
          mkdir -p data/observations scripts .github/workflows

          python - <<'PY'
          import json, re, urllib.parse
          from pathlib import Path
          root=Path('.')
          data=root/'data'
          obs=data/'observations'

          cfg={
            'app':'Private Server Price Tracker','version':'1.1.3','target_budget':2400,'currency':'USD',
            'storage_requirement_tb':4,
            'storage_configs':{
              'A':{'label':'2 × 4 TB approved TLC NVMe','product_id':'nvme-4tb','qty':2,'usable_tb':4,'scheme':'Mirror'},
              'B':{'label':'4 × 2 TB approved TLC NVMe','product_id':'nvme-2tb','qty':4,'usable_tb':4,'scheme':'RAID10'}
            },'stale_after_hours':48
          }
          (data/'config.json').write_text(json.dumps(cfg,indent=2)+'\n')

          retailers={
            'amazon':'https://www.amazon.com/s?k={q}',
            'newegg':'https://www.newegg.com/p/pl?d={q}',
            'walmart':'https://www.walmart.com/search?q={q}',
            'bestbuy':'https://www.bestbuy.com/site/searchpage.jsp?st={q}',
            'bh':'https://www.bhphotovideo.com/c/search?Ntt={q}&N=0&InitialSearch=yes',
            'microcenter':'https://www.microcenter.com/search/search_results.aspx?Ntt={q}'
          }
          def links(term):
            q=urllib.parse.quote_plus(term)
            return {k:v.format(q=q) for k,v in retailers.items()}
          def p(id,cat,label,model,mfr='Multiple',qty=1,in_build=False,term=None,watch=None,notes='',kind='component',attrs=None):
            x={'id':id,'category':cat,'label':label,'model':model,'manufacturer':mfr,'qty':qty,'in_build':in_build,
               'watch_urls':watch or [],'search_terms':[term or model],'retailer_search_urls':links(term or model),'notes':notes,'kind':kind}
            if attrs: x['attrs']=attrs
            return x
          products=[
            p('cpu','CPU','CPU — Ryzen 9 9950X','AMD Ryzen 9 9950X','AMD',1,True,'AMD Ryzen 9 9950X',
              [{'retailer':'microcenter','url':'https://www.microcenter.com/product/682197/amd-ryzen-9-9950x-granite-ridge-am5-430ghz-16-core-boxed-processor-heatsink-not-included'}],
              'Resolved 16C/32T AM5 baseline CPU.'),
            p('motherboard','Motherboard','Motherboard — ASUS ProArt X870E-CREATOR WIFI','ASUS ProArt X870E-CREATOR WIFI','ASUS',1,True,'ASUS ProArt X870E Creator WiFi',
              [{'retailer':'bh','url':'https://www.bhphotovideo.com/c/product/1855749-REG/asus_proart_x870e_creator_wifi_motherboard.html'}],
              'Four M.2, integrated 10GbE and USB4.',attrs={'m2_slots':4,'pcie_gen':5,'pcie_lanes':'dual x16 physical; x8/x8 capable','ten_gbe':True,'max_ram_gb':256,'expansion_ok':True,'usb4':True}),
            p('ram-128gb','RAM','RAM — 128 GB DDR5','128GB DDR5 (prefer 2x64GB, AM5 QVL-compatible)','Multiple',1,True,'128GB DDR5 2x64GB AM5','', 'Baseline RAM target; choose exact kit from motherboard QVL.'),
            p('ram-96gb','RAM','RAM option — 96 GB DDR5','96GB DDR5 (2x48GB)','Multiple',1,False,'96GB DDR5 2x48GB AM5',notes='Lower-cost day-one alternative.'),
            p('ram-64gb','RAM','RAM option — 64 GB DDR5','64GB DDR5 (2x32GB)','Multiple',1,False,'64GB DDR5 2x32GB AM5',notes='Staged-upgrade alternative.'),
            p('gpu-5070ti','GPU / AI','GPU option — RTX 5070 Ti 16 GB','NVIDIA GeForce RTX 5070 Ti 16GB','NVIDIA',1,False,'RTX 5070 Ti 16GB',notes='Value/performance AI option; separate from core baseline.'),
            p('gpu-5080','GPU / AI','GPU option — RTX 5080 16 GB','NVIDIA GeForce RTX 5080 16GB','NVIDIA',1,False,'RTX 5080 16GB',notes='High-performance AI option.'),
            p('gpu-5090','GPU / AI','GPU option — RTX 5090 32 GB','NVIDIA GeForce RTX 5090 32GB','NVIDIA',1,False,'RTX 5090 32GB',notes='Premium AI option; separate budget.'),
            p('gpu-24gb','GPU / AI','GPU option — 24 GB NVIDIA class','24GB NVIDIA GPU','NVIDIA',1,False,'NVIDIA 24GB GPU',notes='Middle-ground local-AI option.'),
            p('nvme-4tb','Storage','Approved 4 TB TLC NVMe candidates','Approved 4TB TLC PCIe 4 NVMe','Multiple',2,False,'4TB TLC NVMe SN850X NM790 T500',[
              {'retailer':'newegg','url':'https://www.newegg.com/western-digital-4tb-black-sn850x-nvme/p/N82E16820250244'},
              {'retailer':'bh','url':'https://www.bhphotovideo.com/c/product/1846008-REG/lexar_lnm790x004t_rnnnu_nm790_m_2_2280_pcie.html'},
              {'retailer':'microcenter','url':'https://www.microcenter.com/product/683967/crucial-t500-4tb-3d-tlc-nand-flash-pcie-gen-4-x4-nvme-m2-internal-ssd'}],
              'Storage A uses two; track multiple approved TLC models.'),
            p('nvme-2tb','Storage','Approved 2 TB TLC NVMe candidates','Approved 2TB TLC PCIe 4 NVMe','Multiple',4,False,'2TB TLC NVMe SN850X T500 990 PRO',notes='Storage B uses four.'),
            p('boot-ssd','Boot/Cache SSD','Boot SSD — 1 TB NVMe','1TB reliable NVMe SSD','Multiple',1,True,'1TB NVMe SSD TLC',notes='Separate OS/application drive.'),
            p('case','Case','Full tower / workstation case','E-ATX full tower with 4+ physical drive positions','Multiple',1,True,'E-ATX full tower 4 drive bays GPU clearance',notes='Large GPU clearance, airflow and expansion.'),
            p('cpu-cooler','Cooling','High-end CPU cooling','360mm AIO or equivalent high-end air cooler','Multiple',1,True,'Ryzen 9950X 360mm AIO cooler',notes='Sized for sustained server load.'),
            p('psu','PSU','PSU — 1000 W ATX 3.1','1000W fully modular ATX 3.1 PSU','Multiple',1,True,'1000W ATX 3.1 PSU',notes='Quality modular baseline; increase if future GPU requires.'),
            p('10gbe','Networking','10 GbE networking','Integrated 10GbE on ProArt board / Intel X550-class fallback','Multiple',1,True,'Intel X550 10GbE adapter',notes='Integrated on resolved motherboard; fallback adapter tracked.'),
            p('usb4','High-Speed I/O','USB4 / 40 Gbps-class I/O','Integrated USB4 on ProArt board','ASUS',1,True,'USB4 40Gbps PCIe card',notes='Integrated on resolved motherboard.'),
            p('sd-reader','Ingestion','UHS-II USB-C SD reader','UHS-II USB-C SD card reader','Multiple',1,True,'UHS-II USB-C SD card reader',notes='Quarantine/scan workflow before import.'),
            p('firewall','Firewall','Dedicated OPNsense firewall appliance','OPNsense-capable appliance with Intel NICs','Multiple',1,True,'OPNsense firewall appliance Intel 2.5GbE',notes='Separate security boundary.'),
            p('backup-ssd','Backup','Offline backup SSD','4TB external SSD','Multiple',1,False,'4TB external SSD',notes='Normally disconnected.'),
            p('vault','Vault','Secondary vault hardware','1TB SSD small-form-factor vault','Multiple',1,False,'mini PC Raspberry Pi SSD 1TB',notes='Future secondary-location vault.'),
            p('prebuilt-ibuypower-7900x-5080','Prebuilt Donor','Donor — iBUYPOWER Slate 7900X / RTX 5080','iBUYPOWER Slate Ryzen 9 7900X RTX 5080 32GB 2TB','iBUYPOWER',1,False,'iBUYPOWER Slate Ryzen 9 7900X RTX 5080',notes='Evaluate donor value.',kind='prebuilt'),
            p('prebuilt-asus-g700-5080','Prebuilt Donor','Donor — ASUS ROG G700 / RTX 5080','ASUS ROG G700 Core Ultra 7 265KF RTX 5080 32GB 2TB','ASUS',1,False,'ASUS ROG G700 RTX 5080',notes='Evaluate donor value.',kind='prebuilt'),
            p('prebuilt-cyberpower-9950x-5070ti','Prebuilt Donor','Donor — CyberPowerPC 9950X / RTX 5070 Ti','CyberPowerPC Ryzen 9 9950X RTX 5070 Ti 64GB 4TB','CyberPowerPC',1,False,'CyberPowerPC Ryzen 9 9950X RTX 5070 Ti 64GB 4TB',[
              {'retailer':'bestbuy','url':'https://www.bestbuy.com/product/cyberpowerpc-gaming-desktop-amd-ryzen-9-9950x-2024-nvidia-geforce-rtx-5070-ti-16gb-64gb-ddr5-memory-4tb-ssd-storage-black/J3GWTS9P79'}],
              'Closest donor to core CPU/storage requirements.',kind='prebuilt'),
            p('prebuilt-skytech-king95','Prebuilt Donor','Donor — Skytech King 95 9950X3D / RTX 5080','Skytech King 95 Ryzen 9 9950X3D RTX 5080 64GB 4TB','Skytech',1,False,'Skytech King 95 9950X3D RTX 5080 64GB 4TB',[
              {'retailer':'walmart','url':'https://www.walmart.com/ip/15571562340'}],kind='prebuilt'),
            p('prebuilt-skytech-o11v','Prebuilt Donor','Donor — Skytech O11V 9950X3D / RTX 5080','Skytech O11V Ryzen 9 9950X3D RTX 5080 64GB 4TB','Skytech',1,False,'Skytech O11V 9950X3D RTX 5080 64GB 4TB',[
              {'retailer':'walmart','url':'https://www.walmart.com/ip/17894368646'}],kind='prebuilt'),
            p('prebuilt-cyberpower-9950x3d-5080','Prebuilt Donor','Donor — CyberPowerPC 9950X3D / RTX 5080','CyberPowerPC Ryzen 9 9950X3D RTX 5080 64GB 4TB','CyberPowerPC',1,False,'CyberPowerPC 9950X3D RTX 5080 64GB 4TB',[
              {'retailer':'walmart','url':'https://www.walmart.com/ip/15901106431'}],kind='prebuilt'),
            p('prebuilt-arsenal-9950x-5080','Prebuilt Donor','Donor — ArsenalPC 9950X / RTX 5080 / 128GB','ArsenalPC ASUS Prime AP202 Ryzen 9 9950X RTX 5080 128GB 4TB','ArsenalPC',1,False,'ArsenalPC Ryzen 9 9950X RTX 5080 128GB 4TB',[
              {'retailer':'newegg','url':'https://www.newegg.com/arsenalpc-gaming-desktop-pcs-nvidia-geforce-rtx-5080-amd-ryzen-9-9950x-128gb-ddr5-4tb-nvme-ssd-black/p/3D5-0073-00CS9'}],
              'Track primarily for unusually deep discounts.',kind='prebuilt')
          ]
          # Correct any accidental non-list watch argument caused by optional calls.
          for x in products:
            if not isinstance(x.get('watch_urls'),list): x['watch_urls']=[]
          (data/'products.json').write_text(json.dumps(products,indent=2)+'\n')
          matrix=[{'id':x['id'],'category':x['category'],'name':x['model'],'exact':x['watch_urls'],'search':x['retailer_search_urls']} for x in products]
          (data/'retailer_url_matrix.json').write_text(json.dumps(matrix,indent=2)+'\n')
          for x in products:
            f=obs/(x['id']+'.json')
            if not f.exists(): f.write_text('[]\n')

          # Patch the existing PWA to remove browser-side GitHub write credentials.
          idx=root/'index.html'
          if idx.exists():
            s=idx.read_text()
            s=s.replace('PST v1.0.0','PST v1.1.3').replace('PRIVATE SERVER PRICE TRACKER — PST v1.0.0','PRIVATE SERVER PRICE TRACKER — PST v1.1.3')
            # Remove PAT field and adapter secrets from Setup while preserving repo/branch settings.
            s=re.sub(r'\s*<label>Fine-grained personal access token</label>.*?<p class="hint">Scope the token.*?</p>',
                     '\n        <p class="hint">Read-only browser mode. No GitHub token is stored in the iPhone app; automated checks run in GitHub Actions.</p>',s,flags=re.S)
            s=re.sub(r'\s*<section>\s*<h2>Adapters</h2>.*?</section>',
                     '\n    <section><h2>Automated checks</h2><div class="card"><p class="hint">Price checks run through GitHub Actions in no-API mode. Blocked pages are recorded as check_failed; prices are never guessed.</p></div></section>',s,count=1,flags=re.S)
            s=s.replace('const S = Object.assign({ repo:"", branch:"main", token:"", bbkey:"", proxy:"", autocheck:false }, LS.load());',
                        'const S = Object.assign({ repo:"", branch:"main", autocheck:false }, LS.load()); delete S.token; delete S.bbkey; delete S.proxy;')
            s=s.replace('canWrite(){ return !!(S.token && S.repo); }','canWrite(){ return false; }')
            # In read(), always use relative GitHub Pages JSON rather than Authorization headers.
            s=re.sub(r'async read\(path\)\{.*?\n  \},\n  async write\(path, obj, msg\)\{.*?\n  \}\n\};',
                     'async read(path){ const r=await fetch(path+"?v="+Date.now(),{cache:"no-store"}); if(!r.ok)return null; return await r.json(); },\n  async write(){ throw new Error("Browser write access is disabled. Use GitHub Actions or export manual entries."); }\n};',s,count=1,flags=re.S)
            # Remove references to secret-setting controls if present.
            s=s.replace('$("#set-token").value=S.token;','').replace('$("#set-bbkey").value=S.bbkey;','').replace('$("#set-proxy").value=S.proxy;','')
            s=re.sub(r'S\.token=\$\("#set-token"\).*?;','',s).replace('S.bbkey=$("#set-bbkey").value.trim();','').replace('S.proxy=$("#set-proxy").value.trim();','')
            idx.write_text(s)
          PY

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Migrate tracker to v1.1.3 layout and catalog"
          git push
