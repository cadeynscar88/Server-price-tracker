name: SerpApi Price Check

on:
  workflow_dispatch:
  schedule:
    # Twice weekly: Tuesdays and Fridays at 06:17 UTC.
    # GitHub Actions cron is always UTC.
    - cron: '17 6 * * 2,5'

permissions:
  contents: write

concurrency:
  group: pst-price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tracker configuration before API calls
        run: python scripts/validate_tracker.py
      - name: Collect Google Shopping offers through SerpApi
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          # Hard-capped by data/config.json as well. Derived items do not consume searches.
          SERPAPI_DAILY_BATCH: '24'
        run: python scripts/check_prices.py
      - name: Rebuild summary and retailer status
        run: |
          python scripts/build_summary.py
          python scripts/build_retailer_status.py
      - name: Commit observations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No tracker data changes to commit."
            exit 0
          fi
          git commit -m "Update SerpApi price observations"

          # main may advance while SerpApi is running (for example from a manual edit,
          # preflight-related commit, or another maintenance change). Rebase the
          # generated observation commit onto the latest main before pushing.
          git fetch origin main
          git rebase origin/main

          # Retry once if main advances in the small window between fetch/rebase and push.
          if ! git push origin HEAD:main; then
            echo "Remote main advanced during push; rebasing once more and retrying."
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
