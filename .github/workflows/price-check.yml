name: SerpApi Price Check

on:
  workflow_dispatch:
  schedule:
    # Twice weekly: Tuesdays and Fridays at 06:17 UTC.
    # GitHub Actions cron is always UTC.
    - cron: '17 6 * * 2,5'

permissions:
  contents: write

concurrency:
  group: pst-price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tracker configuration before API calls
        run: python scripts/validate_tracker.py
      - name: Collect Google Shopping offers through SerpApi
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          # Hard-capped by data/config.json as well. Derived items do not consume searches.
          SERPAPI_DAILY_BATCH: '24'
        run: python scripts/check_prices.py
      - name: Rebuild summary and retailer status
        run: |
          python scripts/build_summary.py
          python scripts/build_retailer_status.py
      - name: Commit observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update SerpApi price observations"
          git push
