name: Import Price Screenshot

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: pst-screenshot-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  import:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[price-screenshot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Read screenshot and record unambiguous price
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/import_price_screenshot.py
      - name: Rebuild summary and retailer status
        run: |
          python scripts/build_summary.py
          python scripts/build_retailer_status.py
      - name: Commit verified screenshot price
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Import owner-verified screenshot price"
          git push
      - name: Report result on issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('manual_result.json', 'utf8'));
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: r.ok ? `✅ ${r.message}` : `⚠️ ${r.message}`
            });
            if (r.ok) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            }
