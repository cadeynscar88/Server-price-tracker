<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10141a"><title>High-power PSU history</title><style>:root{--bg:#10141a;--panel:#18202a;--panel2:#121922;--line:#2b3746;--ink:#edf3f8;--muted:#93a4b5;--good:#53d486;--warn:#e2af52;--blue:#6bb8ff}*{box-sizing:border-box}body{margin:auto;max-width:980px;padding:18px 14px 30px;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.back{color:var(--ink);text-decoration:none}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.meta{color:var(--muted);font-size:12px}.chart{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:10px}.chart svg{width:100%;height:320px;display:block}.rec{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.rec:last-child{border:0}.price{font-weight:750}.rank{font-weight:800;color:var(--warn)}h1{font-size:21px}h2{font-size:15px}</style></head><body><a class="back" href="index.html">‹ Back to tracker</a><h1>1500–1650W PSU market history</h1><div class="meta">Final dual-GPU power-supply research · verified dated observations only</div><div class="card"><h2>Price graph</h2><div class="meta" id="note"></div><div class="chart"><svg id="chart" viewBox="0 0 760 320" preserveAspectRatio="none"></svg></div></div><div class="card"><h2>Current recommendations</h2><div id="recs"></div></div><div class="card meta" id="coverage"></div><script>const $=s=>document.querySelector(s),money=n=>'$'+Number(n).toFixed(2);function el(t,a={}){const e=document.createElementNS('http://www.w3.org/2000/svg',t);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e}fetch('data/psu_market_history.json?v='+Date.now()).then(r=>r.json()).then(d=>{recs.innerHTML=d.recommendations.map(x=>`<div class="rec"><div class="rank">#${x.rank}</div><div><b>${x.model}</b><div class="meta">${x.watts}W · ${x.efficiency} · ${x.standard}<br>${x.notes}</div></div><div class="price">${money(x.current_price)}<div class="meta">BUY ≤ ${money(x.buy_at_or_below)}</div></div></div>`).join('');coverage.textContent=d.coverage_note;note.textContent='Same-family HX1500i history plus clearly labeled predecessor/exact-recommendation observations. Hover is not required; dates and prices are represented on the axes.';const a=d.history.map(x=>({...x,t:new Date(x.date).getTime()})).sort((u,v)=>u.t-v.t),svg=$('#chart'),W=760,H=320,p={l:66,r:18,t:18,b:42},iw=W-p.l-p.r,ih=H-p.t-p.b,minT=Math.min(...a.map(x=>x.t)),maxT=Math.max(...a.map(x=>x.t)),minP=180,maxP=680,x=t=>p.l+(t-minT)/(maxT-minT)*iw,y=v=>p.t+(maxP-v)/(maxP-minP)*ih;for(let i=0;i<=5;i++){const v=minP+(maxP-minP)*i/5,yy=y(v);svg.append(el('line',{x1:p.l,y1:yy,x2:W-p.r,y2:yy,stroke:'#2b3746'}));const tx=el('text',{x:4,y:yy+4,fill:'#93a4b5','font-size':11});tx.textContent='$'+Math.round(v);svg.append(tx)}const hx=a.filter(q=>q.model.includes('HX1500i'));svg.append(el('polyline',{points:hx.map(q=>`${x(q.t)},${y(q.price)}`).join(' '),fill:'none',stroke:'#6bb8ff','stroke-width':3}));a.forEach(q=>{const c=q.kind==='exact_recommendation'?'#53d486':q.kind==='predecessor_proxy'?'#e2af52':'#6bb8ff';svg.append(el('circle',{cx:x(q.t),cy:y(q.price),r:5,fill:c,stroke:'#10141a','stroke-width':2}));const tx=el('text',{x:x(q.t),y:y(q.price)-9,fill:c,'font-size':9,'text-anchor':'middle'});tx.textContent='$'+Math.round(q.price);svg.append(tx)});[2021,2022,2023,2024,2025,2026].forEach(yr=>{const t=new Date(yr+'-07-01').getTime();if(t>=minT&&t<=maxT){const tx=el('text',{x:x(t),y:H-12,fill:'#93a4b5','font-size':11,'text-anchor':'middle'});tx.textContent=yr;svg.append(tx)}})}).catch(e=>note.textContent='Could not load data: '+e.message);</script></body></html>
